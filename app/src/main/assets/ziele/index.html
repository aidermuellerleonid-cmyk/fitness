<!DOCTYPE html>
<html lang="de" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ziele-Kalender</title>
<style>
:root{color-scheme:light;--bg:#f5f7f5;--card:#fff;--tx:#18241f;--mut:#718078;--g:#20a66a;--y:#e8aa32;--r:#e45b59;--ac:#287d5a;--c2:#f1f5f2;--c3:#edf3ef;--c4:#e3ece6;--c5:#d8e3dc;--c6:#9ab6a5;--c7:#e2eae5;--gb:#dff3e8;--yb:#fff1d6;--rb:#fde5e2;--gt:#12623d;--yt:#80580d;--rt:#9c3532}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101914;--card:#1a251e;--tx:#ecf3ee;--mut:#a0b0a5;--g:#43cb87;--y:#f1bf59;--r:#ff7771;--ac:#7ed3a2;--c2:#253229;--c3:#29382f;--c4:#34463a;--c5:#405346;--c6:#71927c;--c7:#35463a;--gb:#244a34;--yb:#504021;--rb:#502c2b;--gt:#9de6b9;--yt:#f5d487;--rt:#ffaaa4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101914;--card:#1a251e;--tx:#ecf3ee;--mut:#a0b0a5;--g:#43cb87;--y:#f1bf59;--r:#ff7771;--ac:#7ed3a2;--c2:#253229;--c3:#29382f;--c4:#34463a;--c5:#405346;--c6:#71927c;--c7:#35463a;--gb:#244a34;--yb:#504021;--rb:#502c2b;--gt:#9de6b9;--yt:#f5d487;--rt:#ffaaa4}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(ellipse at 80% 0%,rgba(208,235,218,.5),transparent 38%),var(--bg);color:var(--tx);min-height:100vh}.brand{max-width:1160px;margin:24px auto 4px;padding:0 22px;display:flex;align-items:center;gap:12px}.brandmark{width:42px;height:42px;border-radius:14px;background:var(--ac);color:white;display:grid;place-items:center;font-size:21px;box-shadow:0 6px 15px color-mix(in srgb,var(--ac) 24%,transparent)}.brand strong{display:block;font-size:17px;letter-spacing:-.03em}.brand span{display:block;color:var(--mut);font-size:12px;margin-top:2px}.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.85fr);gap:20px;padding:14px 22px 32px;max-width:1160px;margin:auto}.card{background:var(--card);border:1px solid color-mix(in srgb,var(--c7) 70%,transparent);border-radius:22px;padding:22px;box-shadow:0 10px 34px rgba(35,63,45,.055)}h2{margin:0 0 12px;font-size:18px;letter-spacing:-.02em}.mut{color:var(--mut);font-size:13px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.head b{font-size:23px;letter-spacing:-.04em}.head .nav:first-child{margin-right:auto}.head b{margin:0 auto}.nav{background:var(--c3);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--ac);font-size:14px;transition:transform .18s,background .18s}.nav:hover{background:var(--c4);transform:translateY(-1px)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px;text-transform:uppercase}.day{background:var(--c2);border-radius:13px;min-height:74px;padding:7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;border:1.5px solid transparent;color:var(--tx);transition:background .16s,border-color .16s,transform .16s}.day:hover{border-color:var(--c6);transform:translateY(-1px)}.day.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card))}.day.today .n{background:var(--ac);color:white;border-radius:50%;width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center}.day.empty{background:none;pointer-events:none}.n{font-size:13px;font-weight:700}.dots{display:flex;gap:4px}.dot{width:9px;height:9px;border-radius:50%;background:var(--c5)}.G{background:var(--g)}.Y{background:var(--y)}.R{background:var(--r)}.q{margin:18px 0}.q p{margin:0 0 8px;font-weight:650;font-size:14px;line-height:1.4}.opts{display:grid;gap:7px}.opt{font-size:14px;background:var(--c3);border-radius:13px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center;border:1.5px solid transparent;color:var(--tx);transition:background .16s,border-color .16s,transform .16s;line-height:1.35}.opt:hover{background:var(--c4);transform:translateY(-1px)}.opt.on.G{background:var(--gb);border-color:var(--g)}.opt.on.Y{background:var(--yb);border-color:var(--y)}.opt.on.R{background:var(--rb);border-color:var(--r)}.opt i{width:11px;height:11px;border-radius:50%;flex:none}.sum{display:flex;gap:9px;margin:14px 0}.sum div{flex:1;text-align:center;border-radius:15px;padding:11px 8px;font-size:25px;font-weight:750}.sum small{display:block;font-size:11px;font-weight:600;opacity:.82;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}.sum .G{background:var(--gb);color:var(--gt)}.sum .Y{background:var(--yb);color:var(--yt)}.sum .R{background:var(--rb);color:var(--rt)}.bar{height:10px;border-radius:8px;background:var(--c7);overflow:hidden;display:flex;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:8px 0}.clear{margin-top:8px;background:none;color:var(--mut);text-decoration:none;font-size:13px;padding:8px 0}.clear:hover{color:var(--rt)}.opt:disabled{cursor:default;opacity:.48}.opt.on:disabled{opacity:1}.note{color:var(--mut);font-size:13px;margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--c2)}#dayc h2{font-size:20px;margin-bottom:4px}#dayc .q:first-of-type{margin-top:17px}#monc{margin-top:0!important}#monc .row:first-of-type{margin-top:17px}#monc hr{border:0;border-top:1px solid var(--c7);margin:16px 0}#monc>p:last-child{font-size:14px;font-weight:600;margin:16px 0 0}.wrap>div:last-child{display:grid;align-content:start;gap:18px}
@media(max-width:820px){.brand{margin:17px auto 2px;padding:0 14px}.wrap{display:flex;flex-direction:column;padding:12px;gap:14px}.wrap>div{display:contents}.wrap>.card:first-child{order:0}#dayc{order:1}.wrap>.card{order:0}#monc{order:2}}@media(max-width:520px){.brand{padding:0 10px}.wrap{padding:10px;gap:12px}.card{padding:16px;border-radius:19px}.grid{gap:4px}.day{min-height:53px;padding:5px;border-radius:10px}.dot{width:7px;height:7px}.dots{gap:2px}.dow{font-size:10px}.head{margin-bottom:13px}.head b{font-size:20px}.nav{width:38px;height:38px}.q{margin:15px 0}.opt{font-size:13px;padding:11px}.sum div{font-size:22px}}
</style></head><body><header class="brand"><div class="brandmark">✦</div><div><strong>Dein Ziele-Kalender</strong><span>Ein guter Tag beginnt mit kleinen Schritten.</span></div></header>
<div class="wrap">
 <div class="card"><div class="head"><button class="nav" id="prev" aria-label="Vorheriger Monat">‹</button><b id="title"></b><button class="nav" id="next" aria-label="Nächster Monat">›</button></div>
  <div class="grid" id="grid"></div>
  <p class="mut">Klicke einen Tag an und beantworte die fünf Fragen. Alles wird automatisch gespeichert.</p></div>
 <div>
  <div class="card" id="dayc"></div>
  <div class="card" style="margin-top:18px" id="monc"></div>
 </div>
</div>
<script>
const AREAS=[
{k:'sleep',n:'Schlaf',q:'Wie viele Stunden hast du geschlafen?',o:[['G','8 Stunden oder mehr'],['Y','4 bis unter 8 Stunden'],['R','Weniger als 4 Stunden']]},
{k:'kcal',n:'Kalorienziel',q:'Wie nah warst du heute an deinem Kalorien-Defizitziel?',o:[['G','Ziel erreicht (weniger als 100 kcal daneben)'],['Y','Weniger als 500 kcal daneben'],['R','Gar kein Defizit erreicht']]},
{k:'goon',n:'Goonen',q:'Hast du heute auf Goonen verzichtet?',o:[['G','Ja'],['Y','Teilweise / weniger als vorgenommen'],['R','Nein']]},
{k:'learn',n:'Lernen',q:'Wie lange hast du heute gelernt?',o:[['G','Mindestens 60 Minuten'],['Y','1 bis 59 Minuten'],['R','Gar nicht']]},
{k:'sport',n:'Sport',q:'Wie viel Sport hast du heute gemacht?',o:[['G','Mindestens 30 Minuten'],['Y','1 bis 29 Minuten'],['R','Gar keinen']]}];
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
let data={};try{data=JSON.parse(localStorage.getItem('ziele')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('ziele',JSON.stringify(data))}catch(e){}};
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
let now=new Date();const todayK=()=>{const d=new Date();return key(d.getFullYear(),d.getMonth(),d.getDate())};let lastDay=todayK();let Y=now.getFullYear(),M=now.getMonth(),sel=key(Y,M,now.getDate());
const $=id=>document.getElementById(id);
const count=e=>{const c={G:0,Y:0,R:0};if(e)Object.values(e).forEach(v=>c[v]++);return c};
const bal=e=>{const c=count(e);let n=0;while(c.R>0&&c.G>0){c.R--;c.G--;n++}while(c.R>0&&c.Y>=2){c.R--;c.Y-=2;n++}c.n=n;return c};
function render(){
 now=new Date();
 $('title').textContent=MN[M]+' '+Y;
 let h=['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="dow">${d}</div>`).join('');
 const off=(new Date(Y,M,1).getDay()+6)%7,dim=new Date(Y,M+1,0).getDate();
 for(let i=0;i<off;i++)h+='<div class="day empty"></div>';
 for(let d=1;d<=dim;d++){const k=key(Y,M,d),e=data[k]||{};
  h+=`<button class="day${k==sel?' sel':''}${d==now.getDate()&&M==now.getMonth()&&Y==now.getFullYear()?' today':''}" data-k="${k}"><span class="n">${d}</span><span class="dots">${AREAS.map(a=>`<span class="dot ${e[a.k]||''}" title="${a.n}"></span>`).join('')}</span></button>`}
 $('grid').innerHTML=h;
 $('grid').querySelectorAll('.day[data-k]').forEach(b=>b.onclick=()=>{sel=b.dataset.k;render();window.scrollTo({top:0,behavior:'smooth'})});
 const [sy,sm,sd]=sel.split('-').map(Number),e=data[sel]||{},c=bal(e),locked=sel!==todayK();
 $('dayc').innerHTML=`<h2>${sd}. ${MN[sm-1]} ${sy}</h2>
 <div class="sum"><div class="G">${c.G}<small>grün</small></div><div class="Y">${c.Y}<small>gelb</small></div><div class="R">${c.R}<small>rot</small></div></div>`+(c.n?`<p class="note">⚖️ ${c.n} roter Bereich${c.n>1?'e':''} ausgeglichen (1 Rot = 1 Grün oder 2 Gelb)</p>`:'')+(locked?`<p class="note">🔒 Nur der heutige Tag kann bearbeitet werden.</p>`:'')+
 AREAS.map(a=>`<div class="q"><p>${a.n}: ${a.q}</p><div class="opts">${a.o.map(([f,t])=>`<button class="opt ${f}${e[a.k]==f?' on':''}" data-a="${a.k}" data-f="${f}"${locked?' disabled':''}><i class="${f}"></i>${t}</button>`).join('')}</div></div>`).join('')+
 (locked?'':`<button class="clear" id="clr">Tag zurücksetzen</button>`);
 $('dayc').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const d=data[sel]=data[sel]||{};
  if(d[b.dataset.a]==b.dataset.f)delete d[b.dataset.a];else d[b.dataset.a]=b.dataset.f;save();render()});
 if($('clr'))$('clr').onclick=()=>{delete data[sel];save();render()};
 // Monat
 const t={G:0,Y:0,R:0},per={};AREAS.forEach(a=>per[a.k]={G:0,n:0});let days=0,perfect=0;
 for(let d=1;d<=dim;d++){const x=data[key(Y,M,d)];if(!x||!Object.keys(x).length)continue;days++;
  const cc=count(x),bb=bal(x);t.G+=bb.G;t.Y+=bb.Y;t.R+=bb.R;if(cc.G==5)perfect++;
  AREAS.forEach(a=>{if(x[a.k]){per[a.k].n++;if(x[a.k]=='G')per[a.k].G++}})}
 const tot=t.G+t.Y+t.R,pct=tot?Math.round((t.G+t.Y*.5)/tot*100):0;
 let streak=0;{let dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()),first=true;
  for(;;){const x=data[key(dt.getFullYear(),dt.getMonth(),dt.getDate())];
   if(x&&Object.keys(x).length==5&&bal(x).R==0){streak++}else if(!first)break;
   first=false;dt.setDate(dt.getDate()-1)}}
 const msg=!tot?'Noch keine Einträge – starte heute! 💪':pct>=80?'Starker Monat – weiter so! 🔥':pct>=50?'Solide, da geht noch mehr! 👍':'Jeder Tag ist ein neuer Anfang. 🌱';
 $('monc').innerHTML=`<h2>Monatsüberblick</h2><div class="mut">${days} Tage erfasst · ${perfect} perfekte Tage · Serie: ${streak} 🔥</div>
 <div class="row"><b style="font-size:28px">${pct}%</b><span class="mut">Zielerreichung</span></div>
 <div class="bar"><div class="G" style="width:${tot?t.G/tot*100:0}%"></div><div class="Y" style="width:${tot?t.Y/tot*100:0}%"></div><div class="R" style="width:${tot?t.R/tot*100:0}%"></div></div>
 <div class="row"><span>🟢 ${t.G}</span><span>🟡 ${t.Y}</span><span>🔴 ${t.R}</span></div>
 <hr style="border:0;border-top:1px solid var(--c7)">`+
 AREAS.map(a=>`<div class="row"><span>${a.n}</span><span class="mut">${per[a.k].G} von ${per[a.k].n} Tagen grün</span></div>`).join('')+`<p>${msg}</p>`;
}
$('prev').onclick=()=>{M--;if(M<0){M=11;Y--}render()};
$('next').onclick=()=>{M++;if(M>11){M=0;Y++}render()};
render();
setInterval(()=>{if(todayK()!==lastDay){lastDay=todayK();const d=new Date();Y=d.getFullYear();M=d.getMonth();sel=lastDay;render()}},30000);
</script></body></html>
